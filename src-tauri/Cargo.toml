[package]
name = "worldstone"
version = "0.1.0"
description = "Automated builder and controller for World of Warcraft emulator servers"
authors = ["WorldStone"]
edition = "2021"

[lib]
# The `_lib` suffix is required on Windows so the lib name never collides with the bin name.
name = "worldstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
sha1 = "0.10"
num-bigint = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "macros", "fs", "net"] }
uuid = { version = "1", features = ["v4"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
